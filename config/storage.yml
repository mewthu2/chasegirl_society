test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Use bin/rails credentials:edit to set the AWS secrets (as aws:access_key_id|secret_access_key)
# amazon:
  service: S3
  access_key_id: <%= ENV["BUCKETEER_AWS_ACCESS_KEY_ID"] || ENV["AWS_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["BUCKETEER_AWS_SECRET_ACCESS_KEY"] || ENV["AWS_SECRET_ACCESS_KEY"] %>
  region: <%= ENV["BUCKETEER_AWS_REGION"] || ENV.fetch("AWS_REGION", "us-east-1") %>
  bucket: <%= ENV["BUCKETEER_BUCKET_NAME"] || ENV["AWS_BUCKET"] %>
